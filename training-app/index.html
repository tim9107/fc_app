<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Training Manager</title>
  <meta name="description" content="Verwalte An- und Abmeldungen für das Mannschaftstraining und Spiele." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen" class="login-container">
    <div class="glass-panel login-panel">
      <div class="logo" style="justify-content: center; margin-bottom: 1.5rem;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <h1 style="font-size: 2rem;">TrainingSync</h1>
      </div>
      <h2 style="text-align: center; margin-bottom: 0.5rem;">Willkommen!</h2>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">Logge dich mit deinem Spielernamen ein. <br><small>(Coach: Raffi, Admin: Admin)</small></p>
      
      <input type="text" id="username-input" class="text-input" placeholder="Dein Name" />
      <button class="btn btn-primary" id="login-btn" style="width: 100%; margin-top: 1rem;">Einloggen</button>
      <div id="login-error" style="color: var(--danger); text-align: center; margin-top: 1rem; display: none;">Benutzer nicht gefunden!</div>
    </div>
  </div>

  <!-- Main App -->
  <div class="app-container" id="app-container" style="display: none;">
    <header class="glass-header">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <h1>TrainingSync</h1>
      </div>
      <nav id="main-nav">
        <button class="nav-btn active" data-view="calendar">Dashboard</button>
        <button class="nav-btn" data-view="team" id="nav-team-btn">Mannschaft</button>
        <button class="nav-btn" data-view="notifications" id="nav-notif-btn">Benachrichtigungen</button>
        <button class="nav-btn" data-view="stats" id="nav-stats-btn">Statistiken</button>
        <button class="nav-btn" data-view="manage" id="nav-coach-btn" style="display: none;">Coach-Bereich</button>
        <button class="nav-btn" data-view="admin" id="nav-admin-btn" style="display: none;">Admin-Bereich</button>
      </nav>
    </header>

    <main id="app-content">
      <!-- Dynamic Content Will Be Rendered Here -->
    </main>
  </div>

  <!-- Reason Modal -->
  <div id="reason-modal" class="modal-overlay" style="display: none;">
    <div class="glass-panel modal-content pop-anim">
      <h3 style="margin-bottom: 1rem; font-size: 1.25rem;">Warum kannst du nicht?</h3>
      <p style="color: var(--text-muted); margin-bottom: 1rem; font-size: 0.9rem;">Bitte gib einen Grund für deine Abwesenheit an.</p>
      <input type="text" id="reason-input" class="text-input" placeholder="z.B. Verletzt, Arbeit, Krank..." />
      <div class="action-buttons" style="margin-top: 1.5rem;">
        <button class="btn" id="cancel-reason-btn" style="background: rgba(255,255,255,0.1); color: white;">Abbrechen</button>
        <button class="btn btn-danger" id="submit-reason-btn">Abmelden</button>
      </div>
    </div>
  </div>

  <div id="match-report-modal" class="modal-overlay" style="display: none; z-index: 1000;">
    <div class="glass-panel" style="max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto;">
      <h3 style="margin-bottom: 1rem;">🏁 Spielbericht</h3>
      
      <div class="form-group" style="background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 0.5rem;">
        <label>Endresultat</label>
        <div style="display:flex; align-items:center; gap: 0.5rem;">
          <input type="number" id="report-res-home" class="text-input" style="width: 80px; text-align: center; margin: 0;" placeholder="Heim">
          <span style="font-weight: bold; font-size: 1.2rem;">:</span>
          <input type="number" id="report-res-away" class="text-input" style="width: 80px; text-align: center; margin: 0;" placeholder="Gast">
        </div>
      </div>

      <div id="report-events-list" style="margin-bottom: 1rem; max-height: 200px; overflow-y: auto;"></div>

      <div style="background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 0.5rem; margin-bottom: 1.5rem;">
        <h4 style="margin-bottom: 0.5rem;">Ereignis hinzufügen</h4>
        <div style="display:flex; gap: 0.5rem; flex-wrap: wrap;">
          <select id="report-event-player" class="select-input" style="flex: 1; min-width: 120px; margin: 0;"></select>
          <select id="report-event-type" class="select-input" style="width: 120px; margin: 0;">
            <option value="goal">⚽️ Tor</option>
            <option value="yellow">🟨 Gelb</option>
            <option value="red">🟥 Rot</option>
          </select>
          <input type="number" id="report-event-minute" class="text-input" style="width: 70px; margin: 0;" placeholder="Min">
          <button class="btn btn-success" onclick="addEventToReport()" style="padding: 0.4rem 0.8rem;">Hinzufügen</button>
        </div>
      </div>

      <div class="action-buttons">
        <button class="btn" style="background: rgba(255,255,255,0.1); color: white;" onclick="closeMatchReportModal()">Schließen</button>
        <button class="btn btn-primary" onclick="saveMatchReport()">Spiel beenden & Speichern</button>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
